<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendre un article — Affaryette</title><link rel="stylesheet" href="css/style.css"></head><body data-page="publish"><header id="header"></header><main class="wrap page narrow"><div class="page-title"><span class="eyebrow">VENDEZ SUR AFFARYETTE</span><h1>Publier un produit</h1><p>Présentez votre article à la communauté.</p></div><form id="publishForm" class="form panel"><label>Nom du produit<input name="name" required maxlength="80" placeholder="Ex. Sac à main lilas"></label><div class="form-row"><label>Catégorie<select name="category" required><option value="">Choisir…</option><option>Vêtements</option><option>Chaussures</option><option>Accessoires</option><option>Maison</option><option>Beauté</option></select></label><label>Prix (DT)<input name="price" type="number" min="0.1" step="0.1" required placeholder="0.00"></label></div><label>Ville<input name="city" required placeholder="Ex. Sousse"></label><label>Description<textarea name="description" rows="4" required placeholder="Décrivez votre article…"></textarea></label><label>Photo du produit<input name="image" type="file" accept="image/*" id="publishImage"></label><img id="publishPreview" class="upload-preview hidden" alt="Aperçu"><button class="btn full">Publier l'annonce</button><p id="publishMessage" class="notice"></p></form></main><footer id="footer"></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/app.js"></script></body></html>
